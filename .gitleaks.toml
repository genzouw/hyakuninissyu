[extend]
useDefault = true

[[rules]]
id = "pii-email"
description = "Personal Identifiable Information: Email Address"
regex = '''(?i)([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})'''
secretGroup = 1
entropy = 0.0

[rules.allowlist]
description = "Ignore known CI bot email addresses, the maintainer's intentionally published contact address (exact match only, to prevent bypass via subdomain/suffix tricks e.g. user@test.com.evil), and bun patch-file path references (e.g. patches/@scope%2Fpkg@1.2.3.patch) that the email regex misidentifies as addresses"
regexes = [
    '''(?i)^genzouw@gmail\.com$''',
    '''(?i)^github-actions\[bot\]@users\.noreply\.github\.com$''',
    '''(?i)^dependabot\[bot\]@users\.noreply\.github\.com$''',
    '''(?i)\.patch$''',
]

[allowlist]
description = "detect-secrets のベースラインファイルは hashed_secret（SHA1 ハッシュ値）を含むが実際のシークレットではないため除外"
paths = ['''.secrets.baseline''']
fingerprints = [
  "adb4ae30dcb8b688e6066f83431629ddff07371d:.secrets.baseline:generic-api-key:130",
  "adb4ae30dcb8b688e6066f83431629ddff07371d:.secrets.baseline:generic-api-key:139"
]

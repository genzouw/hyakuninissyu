repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (Secret Detection)
        description: Detect hardcoded secrets using Gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
        exclude: '^patches/'
      - id: trailing-whitespace
        exclude: '^patches/'
      - id: check-merge-conflict
        name: check merge conflict
        description: コンフリクトマーカーのコミットを防止
      - id: check-added-large-files
        args: ['--maxkb=5000']
        name: check added large files
        description: 巨大ファイル（DBダンプや非圧縮メディア等）の意図しないコミットを防止
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']
        name: no commit to branch
        description: main/masterブランチへの直接コミットを禁止し、CI/CDやレビューのバイパスを防止
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
        name: detect aws credentials
        description: Detects hardcoded AWS credentials
      - id: detect-private-key
        name: detect private key
        description: Detects the presence of private keys
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.11
    hooks:
      - id: trufflehog
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos
        name: typos (Spell Checker)
        description: Detect spelling mistakes using typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.6
    hooks:
      - id: actionlint
        name: actionlint (GitHub Actions Static Analysis)
        description: Detect workflow syntax errors, expression mistakes, and script injection risks (pull_request_target usage is blocked separately by the forbid-pull-request-target hook and zizmor.yml)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        name: zizmor (GitHub Actions Security Static Analysis)
        description: Detect security misconfigurations in GitHub Actions workflows, dependabot.yml and composite actions (actionlint がカバーする構文・式チェックではなく、permissions 過剰・template injection・依存更新ポリシー等を担当)
  - repo: local
    hooks:
      - id: forbid-pull-request-target
        name: forbid pull_request_target in GitHub Actions
        entry: 'pull_request_target'
        language: pygrep
        files: '^\.github/workflows/.*\.ya?ml$'
        args: ['-i']
        description: 'フォークPRからのシークレット漏洩を防ぐため、pull_request_target の使用は禁止されています。pull_request を使用してください。'
      - id: forbid-sensitive-files
        name: forbid sensitive files and AI agent traces
        entry: 意図しない機密ファイルまたはAIエージェントの作業履歴がステージングされています。
        language: fail
        files: >-
          (?ix)(
            (^|/) (
              \.env[^/]*
              | \.npmrc
              | \.yarnrc[^/]*
              | \.?bunfig\.toml$
              | \.bolt/
              | \.lovable/
              | \.devin/
              | \.claude/
              | \.cursor/
              | \.aider
              | \.continue/
              | \.windsurf/
              | \.cline/
              | \.roo/
              | \.copilot/
              | \.codeium/
              | \.cody/
              | \.tabnine/
              | \.zeal/
              | \.aws/
              | \.kube/
              | \.gcp/
              | \.azure/
              | \.vercel/
              | \.netlify/
              | \.idea/
            )
            | (^|/) \.vscode/launch\.json$
            | ^.*\.DS_Store$
            | ^.*~$
            | (^|/) [^/]*credentials[^/]*\.json
            | (^|/) \.git-credentials$
            | (^|/) [._]netrc$
            | (^|/) [^/]*service-account[^/]*\.json
            | (^|/) http-client\.env\.json$
            | (^|/) postman_environment\.json$
            | (^|/) insomnia_.*\.json$
            | (^|/) id_rsa[^/]*
            | (^|/) id_ed25519[^/]*
            | (^|/) (claude|cursor|aider|continue|windsurf|cline|copilot|codeium|cody|tabnine|zeal|gemini|bolt|lovable|devin)-report\.md
            | \.(tfstate|tfvars|auto\.tfvars|db|dump|bak|sqlite.*|sql|csv|tsv|xls|xlsx|xlsm|jsonl|ndjson|sw[a-p]|har|pem|key|cert|crt|p12|pfx|log)$
          )
        exclude: '(?i)((^|/)(\.env\.example$|\.aider\.conf\.yml$|\.aider\.instruction\.md$|\.claude/rules/.*|\.cursor/rules/.*)|^test/fixtures/.*\.(csv|tsv|jsonl|ndjson)$)'
        description: 'AIエージェントの作業ディレクトリ、汎用的なシークレットファイル（APIクライアント環境設定を含む）、パッケージマネージャー設定、データベース・PIIデータのエクスポートファイル、IDE固有設定ファイルおよびOS自動生成・エディタ一時ファイルのコミットをブロックします'
      - id: forbid-foreign-lockfiles
        name: forbid foreign lockfiles
        entry: >-
          bash -c 'found=$(ls -1 package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml pnpm-lock.yml 2>/dev/null; [ -d .yarn ] && echo .yarn/; ls -1 .pnp.cjs .pnp.loader.mjs 2>/dev/null);
          [ -z "$found" ] || { echo "Bun 専業リポジトリです。別のパッケージマネージャーで install した痕跡がワークツリーに残っています:"; echo "$found"; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
        description: 'プロジェクトの標準パッケージマネージャー (Bun) 以外のロックファイルや Yarn Berry の副産物 (.yarn/, .pnp.*) がワークツリーに存在しないか検査します（.gitignore で除外されステージングされない場合でも誤用に気づけるよう、staged file ではなくワークツリーの実体を検査します）'

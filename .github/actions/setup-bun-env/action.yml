name: 'Setup Bun Environment'
description: 'Sets up Bun, configures dependency caching, and installs dependencies.'
inputs:
  bun-version:
    description: 'The version of Bun to install'
    required: false
    default: '1.3.14'

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache bun dependencies
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        # node_modules は復元しない。restore-keys で旧ロックの node_modules が復元されると、
        # bun.lock 更新後に hoist 構成が混在して ajv 等の解決が壊れるため
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

name: 'Setup Bun Environment'
description: 'Sets up Node.js and Bun, configures dependency caching, and installs dependencies.'
inputs:
  bun-version:
    description: 'The version of Bun to install'
    required: false
    default: '1.3.14'

runs:
  using: 'composite'
  steps:
    # build・Playwright・mutation は Node.js 上で動くため、ランナーのプリインストール版に
    # 依存しないよう .node-version で固定する。依存キャッシュは後段の actions/cache が担うため
    # setup-node の cache オプションは使わない
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # node_modules は復元しない。restore-keys で旧ロックの node_modules が復元されると、
        # bun.lock 更新後に hoist 構成が混在して ajv 等の解決が壊れるため
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

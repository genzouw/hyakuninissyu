name: CI

# 全ジョブが必須チェック (context は各ジョブの name:) のため paths フィルタと job 単位の if: は禁止。
# 必須チェックは genzouw/genzouw.com の Terraform で管理しているため、ジョブ名を変える場合は同時に更新する。
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint (including Cyclomatic Complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Cache ESLint cache file
        uses: ./.github/actions/cache-linter
        with:
          linter: eslint

      - name: Run ESLint
        run: bun run lint:eslint

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Cache Stylelint cache file
        uses: ./.github/actions/cache-linter
        with:
          linter: stylelint

      - name: Run Stylelint
        run: bun run lint:style

  markuplint:
    name: Markuplint (HTML/Vue accessibility and structure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Run markuplint
        # `.markuplintrc` の無効化設定が効かず誤検知で常に赤くなっていたため
        # `|| true` で握りつぶしていた (#443)。設定修正により実際に green に
        # なったのでゲートとして機能させる。
        run: bun run lint:markup

  build:
    name: Build (webpack production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: bun run build

  unit:
    name: Unit tests (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # diff-cover がベースブランチとの merge-base を求めるため、全履歴を取得する
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      # --randomize で describe 内のテスト順をシャッフルし、テスト間の状態の持ち越しを検出する。
      # 失敗したらログ末尾の Seed を bun run unit --randomize --seed=<Seed> に渡すと同じ順序で再現できる。
      - name: Run unit tests
        run: bun run unit --randomize

      - name: Setup Python (diff coverage)
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      # PR で追加・変更した src の JS の行のうち、単体テストで実行された割合を検査する。
      # .vue は lcov.info の行番号が <script> ブロック基準でずれているため対象外にしている。
      # jest の collectCoverageFrom で除外している src/main.js・src/router/index.js も、lcov.info に載らないため対象外になる。
      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install -r requirements-coverage.txt
          diff-cover test/unit/coverage/lcov.info \
            --compare-branch "origin/${BASE_REF}" \
            --include 'src/**/*.js' \
            --fail-under 80 \
            --format "markdown:${GITHUB_STEP_SUMMARY}"

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # 導入するブラウザをキーに含める。含めないと Chromium だけを保存した既存キャッシュに完全一致し、
          # actions/cache は完全一致時に保存し直さないため、WebKit が毎回ダウンロードされる
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-webkit
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      # playwright.config.js の chromium / mobile-webkit の 2 プロジェクトで使うブラウザを導入する
      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium webkit

      # pretest:e2e で本番ビルドを作り、dist を配信して全公開ルートを巡回する。
      # 「ビルドは通るがブラウザで起動しない」破壊を Renovate の auto-merge 前に検知する (#482)。
      - name: Run E2E smoke
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

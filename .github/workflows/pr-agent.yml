name: Qodo Merge (formerly PR-Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

# 最小権限とし、ジョブ側で必要な書込権限のみ追加する
permissions:
  contents: read

# 同一 PR への更新やコメント連投で重複起動するのを抑止し、ノイズとコストを削減。
#
# グループにイベント名を含めるのは、コメント起因の実行が PR 起因のレビューを
# 巻き添えで打ち切らないようにするため。ジョブが if で skip される場合でも実行
# 自体はグループを占有するので、両者を同じグループに入れると、ボットが PR に
# コメントしただけで実行中のレビューが cancelled になる (実際に発生していた)。
concurrency:
  group: qodo-merge-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodo_merge:
    name: Auto PR Review
    runs-on: ubuntu-latest
    # 1) Bot 以外のイベントに限定
    # 2) issue_comment は PR に紐づくコメントのみ対象（純粋な Issue では起動しない）
    # 3) リポジトリの信頼済みアクター（OWNER / MEMBER / COLLABORATOR）のみに限定
    #
    # author_association はイベントごとに載っている場所が違う。issue_comment では
    # コメント側 (github.event.comment)、pull_request では PR 側 (github.event.pull_request)
    # に付く。github.event.sender はユーザーオブジェクトで、この項目を持たない。
    # sender.association と書くと常に空となり、ジョブが一度も起動しなくなる。
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.comment.author_association)) ||
        (github.event_name != 'issue_comment' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.pull_request.author_association))
      )
    # PR コメント投稿に必要な権限のみ付与
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qodo Merge の後続ステップに git 操作は不要のため、認証情報を残さない
          persist-credentials: false

      - name: Qodo Merge (PR-Agent) アクションの実行
        # PR-Agent (The-PR-Agent/pr-agent) を使用。
        # qodo-ai/qodo-merge リポジトリは存在しないため、後継メンテナの The-PR-Agent/pr-agent を参照する。
        # third-party アクションは Codacy 等の SAST 要件に従い、フルコミット SHA で pin する。
        # PRのコメントにて `/review`, `/describe`, `/improve`, `/ask` などのコマンドを実行できます。
        uses: The-PR-Agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          # Qodo Merge (PR-Agent) は公開リポジトリ（オープンソース）では無料で利用可能です。
          # GitHub トークンを使用して PR にコメントを追加します。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

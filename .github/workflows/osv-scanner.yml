name: OSV-Scanner

on:
  pull_request:
    branches: ['**']
  # push は既定ブランチのみ。'**' にすると、オープンなPRがあるブランチへの push で
  # push と pull_request が同時発火し、同一コミットに対して二重実行される（#447）。
  # PR の検証は pull_request 側が担う。
  push:
    branches: [main, master]
  schedule:
    - cron: '15 21 * * 0' # 毎週月曜 06:00 JST (= 日曜 21:00 UTC)

permissions:
  contents: read

# 同一ブランチ / PR で OSV-Scanner が重複起動するのを抑止し、無駄な実行を削減
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ランナーに認証情報を残さないようにし、credential 漏えい面を縮小
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          # 明示的な依存関係に対する脆弱性のみを報告します
          # プロジェクトのニーズに合わせて調整可能です
          results-file-name: osv-scanner-results.sarif
        continue-on-error: true # 最初に脆弱性が見つかった場合でも、他のチェックをパスさせます

      - name: SARIF ファイルのアップロード
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always() && hashFiles('osv-scanner-results.sarif') != ''
        with:
          sarif_file: osv-scanner-results.sarif
          category: osv-scanner

name: TruffleHog Secret Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # 毎週火曜 05:00 JST (= 月曜 20:00 UTC) に定期実行
    - cron: '0 20 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    permissions:
      contents: read
    name: Comprehensive Secret Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog (All Secrets)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha || '') }}
          # NOTE: --no-update はアクション側がデフォルトで付与するため extra_args では指定しない
          # --only-verified は削除し、未検証・無効化済みのシークレットも含めて全てブロックするよう厳格化

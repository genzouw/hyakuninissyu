name: TruffleHog Secret Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # 毎週火曜 05:00 JST (= 月曜 20:00 UTC) に定期実行
    - cron: '0 20 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    permissions:
      contents: read
    name: Comprehensive Secret Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog (All Secrets)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        # NOTE: --no-update はアクション側がデフォルトで付与するため extra_args では指定しない
        # --only-verified は削除し、未検証・無効化済みのシークレットも含めて全てブロックするよう厳格化
        # base, head を省略した場合、アクション側で push は before→after、PR は base.sha→head.sha
        # の差分レンジが自動設定され、過去コミットの検知は保証されない。
        # そのため base: '' を明示しつつ head にコミットSHAを指定し、
        # push / PR いずれのイベントでもリポジトリ全履歴をスキャンするようにする
        # （公式ドキュメントの "Advanced Usage: Scan entire branch" 相当の構成）
        #
        # exclude-detectors=GoogleGeminiAPIKey について:
        # main の全履歴スキャンにより、コミット 57d12b2（Firebase 資格情報を
        # 履歴から抹消した際のセキュリティ対応コミット）のコミットメッセージに
        # 監査目的で記載された、既に GCP 側で無効化済みの Firebase Web API key
        # （AIzaSy... 形式）が GoogleGeminiAPIKey 検出器に誤検知される。
        # Firebase Web API key は Gemini API key と同じ AIzaSy... 形式を共有するため
        # 検出器側で区別できない。本プロジェクトは Gemini API キーを CI シークレットとして
        # 使用しない方針（.claude/rules/project.md）のため、実害なく安全に除外できる。
        #
        # 補足（検出器を狭める代替案について）: TruffleHog の --exclude-detectors は
        # 検出器単位でしか除外できず、特定の値のみを除外する CLI オプションは存在しない。
        # また該当値はコミットメッセージ内に存在するため、行番号を持つ走査対象（ファイル）
        # にのみ適用可能な trufflehog:ignore コメントでも除外できない（実機検証で確認済み）。
        # そのため、実在する AIzaSy... 形式キーがソースファイルへ混入した場合は、
        # gitleaks.yml の gcp-api-key ルール（.gitleaks.toml の useDefault=true で有効）
        # および GitHub Secret Scanning が代替の検出手段として機能する
        # （詳細は docs/security/leak-prevention.md を参照）。
        with:
          base: ''
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --exclude-detectors=GoogleGeminiAPIKey

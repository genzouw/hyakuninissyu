name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  S3_PREFIX: hyakunin
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Build
        env:
          GA_ID: ${{ vars.GA_ID }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    # 本リポジトリは公開されているため、本番デプロイは GitHub Environment 経由に
    # 限定している。この宣言があると OIDC トークンの subject が
    #
    #   repo:genzouw/hyakuninissyu:environment:production
    #
    # となり、AWS 側の信頼ポリシーがこの形だけを許可している。environment を
    # 宣言しないワークフローや、main 以外のブランチからのワークフローは
    # デプロイ用ロールを引き受けられない (production 環境のデプロイ可能ブランチを
    # main に限定しているため)。
    #
    # fork からの PR では OIDC トークンが発行されず secrets も渡らないので、
    # 外部からの PR がこの経路でデプロイすることは元からできない。
    environment: production

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # デプロイ先は Repository Variables で管理している。未登録のまま実行すると
      # s3:/// のような不正なパスで失敗するため、原因が分かるよう先に検査する。
      - name: Verify deploy target variables
        run: |
          if [ -z "${S3_BUCKET}" ] || [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "::error::Repository Variables の S3_BUCKET / CLOUDFRONT_DISTRIBUTION_ID が未登録です" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # IndexNow のキーファイルをデプロイ時に動的生成する。
      # 公開リポジトリでキーファイルを直接コミットすると場所が露見するため、Secrets から生成する。
      - name: Generate IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY secret is not set" >&2
            exit 1
          fi
          printf '%s' "${INDEXNOW_KEY}" > "dist/${INDEXNOW_KEY}.txt"

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.txt" \
            --exclude "*.xml"

          # HTML, JSON, TXT (llms.txt, etc.), XML (sitemap.xml) files with shorter cache
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "*.txt" \
            --include "*.xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/${S3_PREFIX}/*"

  indexnow:
    needs: deploy
    permissions: {}
    runs-on: ubuntu-latest
    env:
      SITEMAP_URL: 'https://hyakuninissyu.genzouw.com/sitemap.xml'
      INDEXNOW_HOST: 'hyakuninissyu.genzouw.com'
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      # bojieyang/indexnow-action はリポジトリの Actions allow list 外のため、
      # IndexNow API への直接呼び出しに置換している。
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Submit URLs to IndexNow API
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY secret is not set" >&2
            exit 1
          fi

          # sitemap.xml を取得し <loc> 要素から URL リストを抽出
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${SITEMAP_URL}" -o /tmp/sitemap.xml
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml \
            | sed -E 's|<loc>([^<]+)</loc>|\1|' > /tmp/urls.txt

          if [ ! -s /tmp/urls.txt ]; then
            echo "No URLs found in sitemap: ${SITEMAP_URL}" >&2
            exit 1
          fi

          # IndexNow API へ JSON ペイロードで送信 (1 リクエストあたり最大 10000 URL)
          jq -Rn \
            --arg host "${INDEXNOW_HOST}" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" \
            --rawfile urls /tmp/urls.txt \
            '{
               host: $host,
               key: $key,
               keyLocation: $keyLocation,
               urlList: ($urls | split("\n") | map(select(length > 0)))
             }' > /tmp/payload.json

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/payload.json

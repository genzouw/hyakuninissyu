name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  S3_PREFIX: hyakunin
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      app-js: ${{ steps.app-js.outputs.path }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Build
        env:
          GA_ID: ${{ vars.GA_ID }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: bun run build

      # smoke-production が「本番に今回のビルドが反映されたか」を判定するため、
      # index.html が参照する app.<hash>.js のパスを取り出して渡す
      - name: Extract app bundle path
        id: app-js
        run: |
          set -euo pipefail
          path="$(grep -oE '/js/app\.[0-9a-f]+\.js' dist/index.html | head -n 1 || true)"
          if [ -z "${path}" ]; then
            echo "::error::dist/index.html から /js/app.<hash>.js を抽出できません" >&2
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    # 本リポジトリは公開されているため、本番デプロイは GitHub Environment 経由に
    # 限定している。この宣言があると OIDC トークンの subject が
    #
    #   repo:genzouw/hyakuninissyu:environment:production
    #
    # となり、AWS 側の信頼ポリシーがこの形だけを許可している。environment を
    # 宣言しないワークフローや、main 以外のブランチからのワークフローは
    # デプロイ用ロールを引き受けられない (production 環境のデプロイ可能ブランチを
    # main に限定しているため)。
    #
    # fork からの PR では OIDC トークンが発行されず secrets も渡らないので、
    # 外部からの PR がこの経路でデプロイすることは元からできない。
    environment: production

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # 本番の AWS 認証情報を扱うジョブのため、許可した宛先以外への通信を遮断する。
          # Renovate による Action 更新で宛先が増えたときは、ここへ追加する。
          # S3 バケット名は Repository Variables の S3_BUCKET と合わせる。
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            sts.ap-northeast-1.amazonaws.com:443
            genzouw-static-content.s3.ap-northeast-1.amazonaws.com:443
            cloudfront.amazonaws.com:443

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # デプロイ先は Repository Variables で管理している。未登録のまま実行すると
      # s3:/// のような不正なパスで失敗するため、原因が分かるよう先に検査する。
      - name: Verify deploy target variables
        run: |
          if [ -z "${S3_BUCKET}" ] || [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "::error::Repository Variables の S3_BUCKET / CLOUDFRONT_DISTRIBUTION_ID が未登録です" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # IndexNow のキーファイルをデプロイ時に動的生成する。
      # 公開リポジトリでキーファイルを直接コミットすると場所が露見するため、Secrets から生成する。
      - name: Generate IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY secret is not set" >&2
            exit 1
          fi
          printf '%s' "${INDEXNOW_KEY}" > "dist/${INDEXNOW_KEY}.txt"

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.txt" \
            --exclude "*.xml"

          # HTML, JSON, TXT (llms.txt, etc.), XML (sitemap.xml) files with shorter cache
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "*.txt" \
            --include "*.xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/${S3_PREFIX}/*"

  indexnow:
    needs: deploy
    permissions: {}
    runs-on: ubuntu-latest
    env:
      SITEMAP_URL: 'https://hyakuninissyu.genzouw.com/sitemap.xml'
      INDEXNOW_HOST: 'hyakuninissyu.genzouw.com'
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      # bojieyang/indexnow-action はリポジトリの Actions allow list 外のため、
      # IndexNow API への直接呼び出しに置換している。
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # INDEXNOW_KEY を扱うジョブのため、許可した宛先以外への通信を遮断する。
          egress-policy: block
          allowed-endpoints: >
            hyakuninissyu.genzouw.com:443
            api.indexnow.org:443

      - name: Submit URLs to IndexNow API
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY secret is not set" >&2
            exit 1
          fi

          # sitemap.xml を取得し <loc> 要素から URL リストを抽出
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${SITEMAP_URL}" -o /tmp/sitemap.xml
          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml \
            | sed -E 's|<loc>([^<]+)</loc>|\1|' > /tmp/urls.txt

          if [ ! -s /tmp/urls.txt ]; then
            echo "No URLs found in sitemap: ${SITEMAP_URL}" >&2
            exit 1
          fi

          # IndexNow API へ JSON ペイロードで送信 (1 リクエストあたり最大 10000 URL)
          jq -Rn \
            --arg host "${INDEXNOW_HOST}" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" \
            --rawfile urls /tmp/urls.txt \
            '{
               host: $host,
               key: $key,
               keyLocation: $keyLocation,
               urlList: ($urls | split("\n") | map(select(length > 0)))
             }' > /tmp/payload.json

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/payload.json

  # デプロイ直後の本番に対して、PR 時と同じ E2E スモーク (test/e2e/smoke.spec.js) を実行する (#604)。
  # S3・CloudFront の配信経路や、本番ビルドだけで有効になる分岐 (GA_ID) の破壊を検知する。
  # 検知した時点で本番は壊れているため、破壊を防ぐのではなく気づくまでの時間を縮めるもの。
  # 失敗したら原因のコミットを revert して main に push し、再デプロイする。
  smoke-production:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      E2E_BASE_URL: https://hyakuninissyu.genzouw.com
      APP_JS: ${{ needs.build.outputs.app-js }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CloudFront の無効化は非同期に反映される。古い版を検査しないよう、本番の index.html が
      # 今回のビルドの app.<hash>.js を参照し、その JS 自体も配信されるまで待つ
      - name: Wait for the new build to be served
        run: |
          set -euo pipefail
          if [ -z "${APP_JS}" ]; then
            echo "::error::build ジョブから app.<hash>.js のパスを受け取れていません" >&2
            exit 1
          fi
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "${E2E_BASE_URL}/" | grep -qF "${APP_JS}" \
              && curl -fsS --max-time 10 -o /dev/null "${E2E_BASE_URL}${APP_JS}"; then
              echo "本番が ${APP_JS} を配信しています"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5 分待っても本番が ${APP_JS} を配信しません" >&2
          exit 1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-webkit
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      # playwright.config.js の chromium / mobile-webkit の 2 プロジェクトで使うブラウザを導入する
      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium webkit

      # pretest:e2e のビルドを避けるため、bun run test:e2e ではなく playwright を直接呼ぶ
      - name: Run E2E smoke against production
        run: bun x playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report
          retention-days: 7

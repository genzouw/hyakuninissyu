name: Smoke test production

on:
  workflow_call:
    inputs:
      app-js:
        description: 'デプロイしたビルドの app.<hash>.js のパス。push 起点の呼び出しでは本番がこれを配信するまで待つ'
        type: string
        required: false
        default: ''
  # 05:17 JST。リポジトリ外の CloudFront・CSP の変更をデプロイを待たずに検出する。
  # 毎時 0 分は高負荷でキューのジョブが落とされることがあるため避ける
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      E2E_BASE_URL: https://hyakuninissyu.genzouw.com
      APP_JS: ${{ inputs.app-js }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deploy から呼ばれたとき（呼び出し元のイベントは push）だけ待つ。schedule と
      # workflow_dispatch はその時点の本番を検査する。
      # CloudFront の無効化は非同期に反映される。古い版を検査しないよう、本番の index.html が
      # 今回のビルドの app.<hash>.js を参照し、その JS 自体も配信されるまで待つ
      - name: Wait for the new build to be served
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -z "${APP_JS}" ]; then
            echo "::error::build ジョブから app.<hash>.js のパスを受け取れていません" >&2
            exit 1
          fi
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "${E2E_BASE_URL}/" | grep -qF "${APP_JS}" \
              && curl -fsS --max-time 10 -o /dev/null "${E2E_BASE_URL}${APP_JS}"; then
              echo "本番が ${APP_JS} を配信しています"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5 分待っても本番が ${APP_JS} を配信しません" >&2
          exit 1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-webkit
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      # playwright.config.js の chromium / mobile-webkit の 2 プロジェクトで使うブラウザを導入する
      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium webkit

      # pretest:e2e のビルドを避けるため、bun run test:e2e ではなく playwright を直接呼ぶ
      - name: Run E2E smoke against production
        run: bun x playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report
          retention-days: 7

name: Lychee Link Checker

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日に実行
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-checker:
    name: Lychee Link Checker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 移行前の手順で固定していた lychee のバージョンを維持する（未指定だと最新版を取得する）。
          lycheeVersion: 'v0.24.2'
          # www.npmjs.com は GitHub Actions からのアクセスを bot とみなして
          # 403 Forbidden を返すことがあるため、実リンク切れではなくチェック対象から除外する。
          # github.com が一時的に 504 を返すことがあるため、リトライ回数と待機時間を増やす。
          args: >-
            --verbose --no-progress
            --max-retries 5
            --retry-wait-time 10
            --root-dir './static'
            --exclude-path 'node_modules'
            --exclude-path 'dist'
            --exclude 'https://hyakuninissyu\.genzouw\.com/hyakunin_issyu\.png'
            --exclude 'https://www\.npmjs\.com/'
            './**/*.md' './**/*.html' './**/*.vue'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

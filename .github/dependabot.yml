# Dependabot configuration for automatic dependency updates
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Node.js dependencies (root)
  #
  # 本リポジトリの唯一のロックファイルは bun.lock（npm/yarn のロックファイルは
  # pre-commit の "forbid foreign lockfiles" で禁止している）。
  # `package-ecosystem: npm` は package.json と npm/yarn のロックファイルしか
  # 更新しないため、Dependabot PR は package.json だけが進んだ状態で届き、
  # setup-bun-env の `bun install --frozen-lockfile` が
  # `error: lockfile had changes, but lockfile is frozen` で必ず落ちていた
  # （Bun 依存の全ジョブが一斉に短時間で失敗する）。毎回 PR ブランチ上で
  # `bun install` を手動実行して bun.lock を追従させていたのがこれ。
  # Dependabot は 2025-02-13 に bun を GA でサポートしており
  # (https://github.blog/changelog/2025-02-13-dependabot-version-updates-now-support-the-bun-package-manager-ga/)、
  # `package-ecosystem: bun` にすると package.json と bun.lock を
  # 同一 PR で更新する。これが手動追従の根本対処。
  #
  # 既知のトレードオフ: bun エコシステムは version updates のみ対応で
  # security updates は非対応（
  # https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
  # の Bun 行）。ただし npm のままでも security update PR は bun.lock を
  # 更新しないため同じく CI が落ちる状態であり、実運用上の後退はない。
  # 脆弱性の検知自体は Dependabot alerts / OSV-Scanner / Trivy /
  # Dependency Review が継続してカバーする。
  #
  # ラベルは既存の `npm` を維持している。Dependabot は存在しないラベルを
  # 自動作成しないため、`bun` ラベルへ変更する場合は先にラベルを作成すること。
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    pull-request-branch-name:
      separator: /
    # The Jest stack must be upgraded as a single unit: jest, babel-jest,
    # vue-jest, jest-serializer-vue and jest-environment-* are tightly
    # coupled (transformer ABI, getCacheKey signature, etc.). Allowing
    # Dependabot to bump them individually is the same failure mode that
    # left main with babel-jest@30 + babel-core@6 silently broken before
    # PR #127. CI does not run `npm run unit`, so an individual bump
    # would not be detected. Group them so updates only land together.
    # The stylelint stack has the same problem. stylelint-config-standard-vue
    # v2 moved every shared config (postcss-html, stylelint-config-html,
    # stylelint-config-recommended-vue, ...) from dependencies to
    # peerDependencies, and .stylelintrc.json extends stylelint-config-html
    # directly. Bumping them one at a time leaves an unsatisfied peer no
    # matter which PR lands first, which is exactly what happened with
    # PR #402 / #403 / #406. Group them so they only land together.
    # markuplint スタックも同じ構造の問題を持つ。`markuplint` 本体と
    # `.markuplintrc` が `parser` に指定している `@markuplint/vue-parser` は
    # バージョンが揃っている前提で作られており、片方だけ上がると壊れる。
    # 実際に PR #492 / #504（markuplint 5.0.0）と PR #493
    # （@markuplint/vue-parser 5.0.0）が別々に作られ、markuplint@5 +
    # vue-parser@4 の組み合わせで `markuplint` がレポータ内で
    # `TypeError: Cannot read properties of undefined (reading 'toString')`
    # を起こして異常終了した。Vue ディレクティブを解決できないパーサーが
    # 行番号を持たない violation を返すためで、lint 結果ではなくクラッシュ
    # として現れる。まとめて上げるようグループ化する。
    groups:
      jest-stack:
        patterns:
          - 'jest'
          - 'jest-*'
          - 'babel-jest'
          - '@vue/vue3-jest'
          - '@types/jest'
      stylelint-stack:
        patterns:
          - 'stylelint'
          - 'stylelint-config-*'
          - 'postcss-html'
      markuplint-stack:
        patterns:
          - 'markuplint'
          - '@markuplint/*'
    # Block major bumps while upstream packages cannot follow:
    #   - Jest stack: @vue/vue3-jest@29.2.6 pins peer deps to jest 29.x /
    #     babel-jest 29.x and is npm latest. See Issue #133.
    #   - eslint / neostandard: neostandard@0.13.0 pins peer dep to
    #     eslint ^9 and bundles @stylistic/eslint-plugin@2.11.0 which
    #     crashes on eslint 10 (removed `sourceCode.isSpaceBetweenTokens`).
    #     See closed PR #196.
    #   - markuplint スタック: v5 はグループ化だけでは追従できない破壊的変更で、
    #     `.markuplintrc` の移行が別途必要になる。ローカル検証（bun 1.4.2）では
    #     markuplint@5 + @markuplint/vue-parser@5 に揃えても、現行設定のままでは
    #     493 件（error 118 / warning 375）が発生し CI は通らない。内訳は
    #     Vue ディレクティブ（`v-for` / `:key` / `@click.prevent` 等）が
    #     すべて `no-unknown-attr` になるもので、v5 では Vue の属性仕様を
    #     `@markuplint/vue-spec` として別パッケージで `specs` に指定し、
    #     `extends` を `markuplint:recommended` から `markuplint:recommended-vue`
    #     へ切り替える必要がある。加えて `invalid-attr` / `attr-duplication` /
    #     `required-element` が v6 で削除予定として deprecated になり、それぞれ
    #     `no-unknown-attr` / `no-duplicate-attr` / `require-element` へ改名された
    #     ため、現行 `.markuplintrc` の抑止設定（`allowAttrs` の key / ref、
    #     `.poem-card` `.badge-card` の attr-duplication、`audio` の
    #     required-element）も書き換えが要る。上記 3 点を適用すると 40 件
    #     （error 9 / warning 31）まで落ちるが、残りは実コードの修正判断を
    #     伴うため、専用の移行 PR で扱う。
    # When upstream ships compatible releases, drop the corresponding
    # entries below and let Dependabot resume major bumps.
    ignore:
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'babel-jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vue/vue3-jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'neostandard'
        update-types: ['version-update:semver-major']
      - dependency-name: 'markuplint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@markuplint/*'
        update-types: ['version-update:semver-major']
    # 侵害されたリリースがコミュニティに検知されるまでの猶予を取るため、
    # GitHub 既定の 3 日から 7 日へ引き上げる (zizmor の dependabot-cooldown
    # 監査の既定閾値に合わせた値)。セキュリティ更新は cooldown の対象外で
    # 即時 PR が出るため、脆弱性対応が遅れることはない。このファイル内の
    # 他の cooldown 設定も同じ理由による (npm セクションを参照)。
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    pull-request-branch-name:
      separator: /
    groups:
      github-actions:
        patterns:
          - '*'
    # cooldown 設定の理由は npm セクション（本ファイル冒頭）を参照。
    cooldown:
      default-days: 7

  # Docker dependencies
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
    pull-request-branch-name:
      separator: /
    groups:
      docker:
        patterns:
          - '*'
    # cooldown 設定の理由は npm セクション（本ファイル冒頭）を参照。
    cooldown:
      default-days: 7

  # Python / pip dependencies (for pre-commit hooks etc.)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - pip
    commit-message:
      prefix: chore
      include: scope
    pull-request-branch-name:
      separator: /
    groups:
      pip:
        patterns:
          - '*'
    # cooldown 設定の理由は npm セクション（本ファイル冒頭）を参照。
    cooldown:
      default-days: 7

  # pre-commit hooks (.pre-commit-config.yaml)
  # 各フックは GitHub Actions の外部アクションと同様にコミットSHAで固定している。
  # rev のコメントは "# frozen: <tag>" 形式で記述すること。この形式が無いと
  # Dependabot はタグを解決できず、デフォルトブランチの HEAD SHA に更新して
  # しまうため（CWE-829: 信頼できない管理領域からの機能取り込み）、SHA固定の
  # 意図が損なわれる。frozen 形式であれば、タグ参照の場合と同じ運用手順
  # （自動PR→レビュー→マージ）で正しいタグ解決のまま追従できる。
  # rev 変更に伴う .secrets.baseline の再生成は不要。40桁hexのrev行は
  # .secrets.baseline の detect_secrets.filters.regex.should_exclude_line
  # フィルタで走査対象から外しているため、rev が更新されても detect-secrets
  # hook は落ちない。したがってこのPRで detect-secrets hook が失敗した場合は、
  # ベースラインを再生成して通すのではなく別の原因を疑うこと（再生成は検出
  # 内容を確認せずに握りつぶす操作になり得る）。
  # 再生成が本当に必要になった場合は detect-secrets scan --baseline
  # .secrets.baseline を使う（--update はv1.5.0に存在しないフラグ）。
  # detect-secrets scan > .secrets.baseline のようにリダイレクトすると
  # 上記のカスタムフィルタが消え、rev 更新での誤検知が再発する。
  # 詳細は docs/security/leak-prevention.md の「rev: 行の除外フィルタ」節。
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: chore
      include: scope
    pull-request-branch-name:
      separator: /
    groups:
      pre-commit:
        patterns:
          - '*'
    # crate-ci/typos はモノレポで、本体の v1.x タグと並行して varcon-core や
    # dictgen といったサブクレートのタグ (varcon-core-v5.0.7 等) を同じ
    # リポジトリに打っている。Dependabot はこれらを typos 本体の新しい
    # バージョンと誤認し (5.0.7 > 1.50.1)、5ヶ月古いコミットへ巻き戻す
    # ダウングレードPRを作る。実際に PR #474 がこれに該当し、クローズした。
    # 本体のメジャーリリース (v2.0.0 等) が出た際は、この ignore を外して
    # 手動で追従すること。パッチ/マイナー更新は引き続き自動追従される。
    ignore:
      - dependency-name: 'https://github.com/crate-ci/typos'
        update-types: ['version-update:semver-major']
    # cooldown 設定の理由は npm セクション（本ファイル冒頭）を参照。
    cooldown:
      default-days: 7

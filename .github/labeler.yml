frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - 'build/**/*'
          - 'config/**/*'
          - 'static/**/*'
          - 'test/**/*'
          - 'package.json'
          - 'eslint.config.js'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**/*'
          - '.github/actions/**/*'
          - '.pre-commit-config.yaml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'
          - 'static/llms.txt'
